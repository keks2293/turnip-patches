// fdperf.cfg - the counter set for diagnosing RE4 on Adreno 740 (a7xx).
//
// Format: libconfig.  fdperf parses it from the directory it runs in (CWD).
// The section is the device name (FD740, see `fdperf -d`); inside are group
// sections (CP, PC, ...), and inside those counter0..N, where N is the number
// of hardware counters of the group (table: docs/fdperf-a7xx-counters.md).
// The value is a selector (the registration number of the countable from
// a7xx_perfcntrs.json.h, NOT the alphabetical index).
//
// CP counter0 is reserved by fdperf for PERF_CP_ALWAYS_COUNT (GPU frequency) -
// its value in the config is ignored, but the key stays so it is visible.
//
// The point of the selection is to answer "what is the RE4 wall - memory or
// geometry/vertex":
//   * memory:   UCHE (L2+VBIF), CCU, LRZ, CMP (colour/depth -> GMEM),
//               TP/UFC (textures and constants)
//   * geometry: PC (VS dispatcher), VFD (vertex fetch), VPC (VS core),
//               TSE (topology), RAS (rasteriser), RBBM_*_BUSY
//   * fragment: SP (EU), RB (render backend)
//   * driver CPU side: CP (SQE_IDLE, MEMORY_POOL_*, preemptions, draw rate)
//
// Division by frequency: the percentages in fdperf output are computed from
// max_freq (680 MHz).  For an honest duty cycle compute BUSY_CYCLES /
// RBBM_ALWAYS_ON (both in raw cycles per period) - we always compute from the
// raw values ourselves.

FD740 = {
  CP = {
    counter0  = 0;    // reserved (ALWAYS_COUNT, frequency)
    counter1  = 2;    // PERF_CP_BUSY_CYCLES
    counter2  = 15;   // PERF_CP_SQE_IDLE
    counter3  = 29;   // PERF_CP_SQE_DRAW_EXEC
    counter4  = 11;   // PERF_CP_CONTEXT_DONE
    counter5  = 9;    // PERF_CP_MODE_SWITCH
    counter6  = 12;   // PERF_CP_CACHE_FLUSH
    counter7  = 47;   // PERF_CP_VBIF_READ_BEATS
    counter8  = 48;   // PERF_CP_VBIF_WRITE_BEATS
    counter9  = 32;   // PERF_CP_MEMORY_POOL_EMPTY
    counter10 = 34;   // PERF_CP_MEMORY_POOL_ABOVE_THRESH
    counter11 = 3;    // PERF_CP_NUM_PREEMPTIONS
  }

  RBBM = {
    counter0 = 1;    // PERF_RBBM_ALWAYS_ON (divisor for the duty cycle)
    counter1 = 9;    // PERF_RBBM_VBIF_BUSY
    counter2 = 12;   // PERF_RBBM_UCHE_BUSY
    counter3 = 13;   // PERF_RBBM_HLSQ_BUSY
    counter4 = 4;    // PERF_RBBM_PC_DCALL_BUSY
    counter5 = 5;    // PERF_RBBM_PC_VSD_BUSY
  }

  PC = {
    counter0 = 0;    // PERF_PC_BUSY_CYCLES
    counter1 = 1;    // PERF_PC_WORKING_CYCLES
    counter2 = 2;    // PERF_PC_STALL_CYCLES_VFD
    counter3 = 4;    // PERF_PC_STALL_CYCLES_VPC
    counter4 = 5;    // PERF_PC_STALL_CYCLES_UCHE
    counter5 = 10;   // PERF_PC_STARVE_CYCLES_FOR_INDEX
    counter6 = 25;   // PERF_PC_VS_INVOCATIONS
    counter7 = 20;   // PERF_PC_IA_VERTICES
    counter8 = 28;   // PERF_PC_3D_DRAWCALLS
    counter9 = 16;   // PERF_PC_VPC_PRIMITIVES
  }

  VFD = {
    counter0 = 0;    // PERF_VFD_BUSY_CYCLES
    counter1 = 1;    // PERF_VFD_STALL_CYCLES_UCHE
    counter2 = 5;    // PERF_VFD_STARVE_CYCLES_UCHE
    counter3 = 8;    // PERF_VFD_DECODED_ATTRIBUTE_BYTES
    counter4 = 17;   // PERF_VFD_TOTAL_VERTICES
    counter5 = 9;    // PERF_VFD_NUM_ATTRIBUTES
  }

  HLSQ = {
    counter0 = 0;    // PERF_HLSQ_BUSY_CYCLES
    counter1 = 1;    // PERF_HLSQ_STALL_CYCLES_UCHE
    counter2 = 3;    // PERF_HLSQ_STALL_CYCLES_SP_FS_STAGE
    counter3 = 4;    // PERF_HLSQ_UCHE_LATENCY_CYCLES
    counter4 = 5;    // PERF_HLSQ_UCHE_LATENCY_COUNT
    counter5 = 22;   // PERF_HLSQ_FS_STALL_CYCLES
  }

  VPC = {
    counter0 = 0;    // PERF_VPC_BUSY_CYCLES
    counter1 = 1;    // PERF_VPC_WORKING_CYCLES
    counter2 = 2;    // PERF_VPC_STALL_CYCLES_UCHE
    counter3 = 16;   // PERF_VPC_VS_BUSY_CYCLES
    counter4 = 18;   // PERF_VPC_VS_WORKING_CYCLES
    counter5 = 27;   // PERF_VPC_NUM_ATTR_REQ_LM
  }

  TSE = {
    counter0 = 0;    // PERF_TSE_BUSY_CYCLES
    counter1 = 1;    // PERF_TSE_CLIPPING_CYCLES
    counter2 = 5;    // PERF_TSE_STARVE_CYCLES_PC
    counter3 = 6;    // PERF_TSE_INPUT_PRIM
  }

  RAS = {
    counter0 = 0;    // PERF_RAS_BUSY_CYCLES
    counter1 = 2;    // PERF_RAS_STALL_CYCLES_LRZ
    counter2 = 3;    // PERF_RAS_STARVE_CYCLES_TSE
    counter3 = 11;   // PERF_RAS_LRZ_INTF_WORKING_CYCLES
  }

  UCHE = {
    counter0  = 0;   // PERF_UCHE_BUSY_CYCLES
    counter1  = 1;   // PERF_UCHE_STALL_CYCLES_ARBITER
    counter2  = 2;   // PERF_UCHE_VBIF_LATENCY_CYCLES
    counter3  = 3;   // PERF_UCHE_VBIF_LATENCY_SAMPLES
    counter4  = 27;  // PERF_UCHE_VBIF_READ_BEATS_CH0
    counter5  = 28;  // PERF_UCHE_VBIF_READ_BEATS_CH1
    counter6  = 52;  // PERF_UCHE_VBIF_WRITE_BEATS_CH0
    counter7  = 53;  // PERF_UCHE_VBIF_WRITE_BEATS_CH1
    counter8  = 29;  // PERF_UCHE_GMEM_READ_BEATS
    counter9  = 56;  // PERF_UCHE_GMEM_WRITE_BEATS
    counter10 = 38;  // PERF_UCHE_RAM_READ_REQ
    counter11 = 39;  // PERF_UCHE_RAM_WRITE_REQ
    counter12 = 18;  // PERF_UCHE_EVICTS
    counter13 = 43;  // PERF_UCHE_READ_REQUESTS_TP_UBWC
    counter14 = 44;  // PERF_UCHE_READ_REQUESTS_TP_NONUBWC
    counter15 = 57;  // PERF_UCHE_UBWC_READ_BEATS
    counter16 = 58;  // PERF_UCHE_UBWC_WRITE_BEATS
    counter17 = 54;  // PERF_UCHE_CCHE_TPH_QUEUE_FULL
    counter18 = 55;  // PERF_UCHE_CCHE_DPH_QUEUE_FULL
  }

  TP = {
    counter0 = 0;    // PERF_TP_BUSY_CYCLES
    counter1 = 1;    // PERF_TP_STALL_CYCLES_UCHE
    counter2 = 2;    // PERF_TP_LATENCY_CYCLES
    counter3 = 3;    // PERF_TP_LATENCY_TRANS
    counter4 = 55;   // PERF_TP_STARVE_CYCLES_UCHE
    counter5 = 10;   // PERF_TP_OUTPUT_PIXELS
    counter6 = 6;    // PERF_TP_L1_CACHELINE_REQUESTS
    counter7 = 7;    // PERF_TP_L1_CACHELINE_MISSES
  }

  SP = {
    counter0  = 0;   // PERF_SP_BUSY_CYCLES
    counter1  = 1;   // PERF_SP_ALU_WORKING_CYCLES
    counter2  = 2;   // PERF_SP_EFU_WORKING_CYCLES
    counter3  = 4;   // PERF_SP_STALL_CYCLES_TP
    counter4  = 5;   // PERF_SP_STALL_CYCLES_UCHE
    counter5  = 6;   // PERF_SP_STALL_CYCLES_RB
    counter6  = 7;   // PERF_SP_NON_EXECUTION_CYCLES
    counter7  = 101; // PERF_SP_PIXELS
    counter8  = 44;  // PERF_SP_FS_INSTRUCTIONS
    counter9  = 82;  // PERF_SP_GM_LOAD_LATENCY_CYCLES   <- was 83 until 23.11.  The a7xx enum numbers
                 // these one lower than that comment said (a7xx_perfcntrs.xml:639-641: 82 CYCLES,
                 // 83 SAMPLES, 84 EXECUTABLE_WAVES), so these two slots selected SAMPLES and
                 // EXECUTABLE_WAVES; runs before 23.11 carry no GM_LOAD_LATENCY_CYCLES (journal 41.1,
                 // scripts/fdperf-cfg-check.py).
    counter10 = 83;  // PERF_SP_GM_LOAD_LATENCY_SAMPLES
    counter11 = 119; // PERF_SP_TEXTURE_FETCH_LATENCY_CYCLES
    counter12 = 120; // PERF_SP_TEXTURE_FETCH_LATENCY_SAMPLES
    counter13 = 68;  // PERF_SP_LOW_EFFICIENCY_STARVED_BY_TP
    counter14 = 84;  // PERF_SP_EXECUTABLE_WAVES (what counter10 selected before 23.11; given its own
                 // slot so the old dumps stay comparable)
  }

  RB = {
    counter0 = 0;    // PERF_RB_BUSY_CYCLES
    counter1 = 5;    // PERF_RB_STARVE_CYCLES_SP
    counter2 = 7;    // PERF_RB_STARVE_CYCLES_CCU
    counter3 = 12;   // PERF_RB_Z_READ
    counter4 = 13;   // PERF_RB_Z_WRITE
    counter5 = 14;   // PERF_RB_C_READ
    counter6 = 15;   // PERF_RB_C_WRITE
    counter7 = 44;   // PERF_RB_STALL_CYCLES_CCU
  }

  VSC = {
    counter0 = 0;    // PERF_VSC_BUSY_CYCLES
    counter1 = 2;    // PERF_VSC_STALL_CYCLES_UCHE
  }

  CCU = {
    counter0 = 0;    // PERF_CCU_BUSY_CYCLES
    counter1 = 1;    // PERF_CCU_STALL_CYCLES_RB_DEPTH_RETURN
    counter2 = 2;    // PERF_CCU_STALL_CYCLES_RB_COLOR_RETURN
    counter3 = 8;    // PERF_CCU_GMEM_READ
    counter4 = 9;    // PERF_CCU_GMEM_WRITE
    counter5 = 3;    // PERF_CCU_DEPTH_BLOCKS
    counter6 = 4;    // PERF_CCU_COLOR_BLOCKS
    counter7 = 10;   // PERF_CCU_2D_RD_REQ
    counter8 = 11;   // PERF_CCU_2D_WR_REQ
  }

  LRZ = {
    counter0 = 0;    // PERF_LRZ_BUSY_CYCLES
    counter1 = 1;    // PERF_LRZ_STARVE_CYCLES_RAS
    counter2 = 6;    // PERF_LRZ_STALL_CYCLES_UCHE
    counter3 = 7;    // PERF_LRZ_LRZ_READ
    counter4 = 8;    // PERF_LRZ_LRZ_WRITE
    counter5 = 12;   // PERF_LRZ_PRIM_KILLED_BY_LRZ
    counter6 = 17;   // PERF_LRZ_TOTAL_PIXEL
  }

  CMP = {
    counter0 = 0;    // PERF_CMPDECMP_STALL_CYCLES_ARB
    counter1 = 1;    // PERF_CMPDECMP_VBIF_LATENCY_CYCLES
    counter2 = 2;    // PERF_CMPDECMP_VBIF_LATENCY_SAMPLES
    counter3 = 3;    // PERF_CMPDECMP_VBIF_READ_DATA_CCU
    counter4 = 4;    // PERF_CMPDECMP_VBIF_WRITE_DATA_CCU
    counter5 = 5;    // PERF_CMPDECMP_VBIF_READ_REQUEST
    counter6 = 6;    // PERF_CMPDECMP_VBIF_WRITE_REQUEST
  }

  UFC = {
    counter0 = 0;    // PERF_UFC_BUSY_CYCLES
    counter1 = 43;   // PERF_UFC_MISS_LATENCY_CYCLES
    counter2 = 44;   // PERF_UFC_MISS_LATENCY_SAMPLES
    counter3 = 40;   // PERF_UFC_PREFETCH_STALLED_CYCLES
  }
}
